<header class="navbar-wrapper">
  <nav class="navbar" aria-label="Main navigation">
    <a class="brand" routerLink="/user" aria-label="RTX Jewelry home">
      <span class="brand-mark">RTX</span>
      <span class="brand-name">Jewelry</span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMenuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" [class.open]="isMenuOpen()">
      <li><a routerLink="/user" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a></li>
      <li><a routerLink="/user/products" routerLinkActive="active" (click)="closeMenu()">Products</a></li>
      <li><a routerLink="/user/offers" routerLinkActive="active" (click)="closeMenu()">Offers</a></li>
      <li><a routerLink="/user/feedback" routerLinkActive="active" (click)="closeMenu()">Feedback</a></li>
      <li><a routerLink="/user/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a></li>
    </ul>
  </nav>
</header>
