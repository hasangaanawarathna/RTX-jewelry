<header class="navbar-wrapper">
  <nav class="navbar" aria-label="Main navigation">
    <a class="brand" routerLink="/" aria-label="RTX Jewelry home">
      <span class="brand-mark">RTX</span>
      <span class="brand-name">Jewelry</span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="isMenuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" [class.open]="isMenuOpen()">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a></li>
      <li><a routerLink="/products" routerLinkActive="active" (click)="closeMenu()">Products</a></li>
      <li><a routerLink="/offers" routerLinkActive="active" (click)="closeMenu()">Offers</a></li>
      <li><a routerLink="/feedback" routerLinkActive="active" (click)="closeMenu()">Feedback</a></li>
      <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a></li>
      <li>
        <a
          routerLink="/admin/login"
          routerLinkActive="active"
          class="admin-login-link"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
        >
          Admin Login
        </a>
      </li>
    </ul>
  </nav>
</header>
